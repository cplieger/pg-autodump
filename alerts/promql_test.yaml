# promtool test rules alerts/promql_test.yaml
rule_files:
  - promql.yaml

evaluation_interval: 1m

tests:
  - name: a failing scrape pages after 5m and keeps the target's labels
    interval: 1m
    input_series:
      - series: 'up{job="pg-autodump", instance="pg-autodump:9847"}'
        values: "1 0x10"
    alert_rule_test:
      - eval_time: 4m
        alertname: PgAutodumpDown
        exp_alerts: []
      - eval_time: 8m
        alertname: PgAutodumpDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: pg-autodump
              instance: pg-autodump:9847
            exp_annotations:
              summary: "pg-autodump is not being scraped"
              description: "No successful scrape for 5m: the container is stopped, crash-looping or refusing to start, or the scrape cannot reach LISTEN_ADDR. Check the container's state and its log.\n"

  - name: a target that is gone pages through the absent arm
    interval: 1m
    input_series:
      - series: 'up{job="other", instance="x:1"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: PgAutodumpDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: pg-autodump
            exp_annotations:
              summary: "pg-autodump is not being scraped"
              description: "No successful scrape for 5m: the container is stopped, crash-looping or refusing to start, or the scrape cannot reach LISTEN_ADDR. Check the container's state and its log.\n"

  - name: PgAutodumpDumpFailed holds for the failing database only and clears at its next good dump
    interval: 1h
    input_series:
      - series: 'pg_autodump_dump_ok{job="pg-autodump", instance="pg-autodump:9847", server="db1_5432", db="app"}'
        values: "1 0x23 1x4"
      - series: 'pg_autodump_dump_ok{job="pg-autodump", instance="pg-autodump:9847", server="db1_5432", db="billing"}'
        values: "1x28"
    alert_rule_test:
      - eval_time: 0m
        alertname: PgAutodumpDumpFailed
        exp_alerts: []
      - eval_time: 23h
        alertname: PgAutodumpDumpFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: pg-autodump
              instance: pg-autodump:9847
              server: db1_5432
              db: app
            exp_annotations:
              summary: "pg-autodump: the latest dump of app failed"
              description: "The latest dump of app on db1_5432 failed, so its backup is getting older. The last good dump is kept. The `dump <reason>` log line for the database names the cause.\n"
      - eval_time: 26h
        alertname: PgAutodumpDumpFailed
        exp_alerts: []

  - name: PgAutodumpDumpStale fires once the newest dump is older than 50h and clears at a new dump
    interval: 1h
    input_series:
      # The newest dump was written at the epoch, then again at 52h.
      - series: 'pg_autodump_newest_dump_timestamp_seconds{job="pg-autodump", instance="pg-autodump:9847", server="db1_5432", db="app"}'
        values: "0x51 187200x5"
    alert_rule_test:
      - eval_time: 49h
        alertname: PgAutodumpDumpStale
        exp_alerts: []
      - eval_time: 51h
        alertname: PgAutodumpDumpStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: pg-autodump
              instance: pg-autodump:9847
              server: db1_5432
              db: app
            exp_annotations:
              summary: "pg-autodump: no new dump of app in 50h"
              description: "The newest verified dump of app on db1_5432 is older than 50h. Dumps may be failing, or the timer or your trigger may have stopped. Check the container, its schedule and PgAutodumpDumpFailed.\n"
      - eval_time: 53h
        alertname: PgAutodumpDumpStale
        exp_alerts: []
