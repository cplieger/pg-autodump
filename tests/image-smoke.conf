# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Boots the image against a REAL PostgreSQL sidecar on
# a private docker network, then smoke_verify proves three things: one real dump
# cycle reaches the sidecar and the shipped pg_restore reads the seeded schema
# and row back out of the archive; a pg_dump refused by row-level security is
# reported as a failed cycle that turns health off, with a clean cycle through
# the resident server turning it back on without a restart; and a hidden libpq
# stops every pg client from executing, which the preflight catches before any
# dump starts. A health-only smoke once passed an image whose pg clients could
# not load libpq (CONTRIBUTING.md carries the measurement).
#
# SMOKE_PG_IMAGE's major is the client-major floor: pg_dump refuses to dump a
# server newer than itself, so this pin asserts that the Dockerfile's
# postgresqlNN-client major (a hardcoded literal nothing tracks) has not fallen
# behind the newest PostgreSQL major this image must dump. Bump the two together.

SMOKE_APP_NAME=pg-autodump
# The image bakes a 6m HEALTHCHECK start-period for a slow startup dump, but
# external-trigger mode marks the marker on boot and a healthy probe ends the
# start period early, so the app reports healthy in seconds; the budget covers
# the sidecar's first-boot initdb on a cold runner.
SMOKE_TIMEOUT=120

# Sidecar and network names carry this shell's PID, the same shape the harness
# uses for its own container, so parallel runs on one host never collide.
SMOKE_NET="smoke-${SMOKE_APP_NAME}-net-$$"
SMOKE_PG="smoke-${SMOKE_APP_NAME}-pg-$$"
# Newest PostgreSQL SERVER major this image is built to dump. Pulled from the
# AWS ECR public mirror of the official image (byte-identical: same image ID as
# docker.io/library/postgres:18-alpine, verified) because the shared CI docker
# job does not log in to Docker Hub, so a Hub pull here would run against the
# anonymous per-IP rate limit on every PR.
SMOKE_PG_IMAGE=public.ecr.aws/docker/library/postgres:18-alpine
SMOKE_DB=smokedb
SMOKE_ROLE=dbdumper_ro
# Not a secret: a throwaway role in a container that lives for one test run on a
# network with no published port.
SMOKE_PW=smoke-not-a-secret

# Release what the setup below acquires: the harness's EXIT trap calls this after
# removing the app container, and every failure path here calls it directly
# (the trap is armed only after this file is sourced). -v matters: the postgres
# image declares a VOLUME for its data directory, so a plain `docker rm -f`
# leaves an anonymous volume behind on every run.
# shellcheck disable=SC2329  # invoked indirectly via the harness EXIT trap
smoke_cleanup() {
  docker rm -f -v "$SMOKE_PG" >/dev/null 2>&1 || true
  docker network rm "$SMOKE_NET" >/dev/null 2>&1 || true
}

# Pull explicitly so a registry failure is reported as one, instead of surfacing
# as an unexplained container-start failure with the pull progress on stderr.
if ! docker pull -q "$SMOKE_PG_IMAGE" >/dev/null; then
  printf 'FAIL: could not pull the PostgreSQL sidecar image %s\n' "$SMOKE_PG_IMAGE" >&2
  exit 1
fi
if ! docker network create "$SMOKE_NET" >/dev/null; then
  printf 'FAIL: could not create the smoke network %s\n' "$SMOKE_NET" >&2
  smoke_cleanup
  exit 1
fi
if ! docker run -d --name "$SMOKE_PG" --network "$SMOKE_NET" \
  -e POSTGRES_PASSWORD="$SMOKE_PW" -e POSTGRES_DB="$SMOKE_DB" \
  "$SMOKE_PG_IMAGE" >/dev/null; then
  printf 'FAIL: could not start the PostgreSQL sidecar %s\n' "$SMOKE_PG_IMAGE" >&2
  smoke_cleanup
  exit 1
fi

# Seeding over TCP IS the readiness gate: the postgres entrypoint runs its initdb
# phase with listen_addresses='' (unix socket only), so a TCP round-trip that
# succeeds proves the real server is up and there is no window in which the app
# can reach a half-initialised one. The whole fixture is one --command, so psql
# wraps it in a single transaction and a retry is all-or-nothing.
smoke_seeded=0
smoke_i=0
while [ "$smoke_i" -lt 60 ]; do
  if smoke_seed_out=$(docker exec "$SMOKE_PG" psql -v ON_ERROR_STOP=1 \
    --host=127.0.0.1 --username=postgres --dbname="$SMOKE_DB" \
    --command="CREATE TABLE smoke_rows (id int PRIMARY KEY, note text);
      INSERT INTO smoke_rows VALUES (1, 'pg-autodump smoke row');
      CREATE ROLE ${SMOKE_ROLE} LOGIN PASSWORD '${SMOKE_PW}';
      GRANT pg_read_all_data TO ${SMOKE_ROLE};
      GRANT CONNECT ON DATABASE ${SMOKE_DB} TO ${SMOKE_ROLE};" 2>&1); then
    smoke_seeded=1
    break
  fi
  smoke_i=$((smoke_i + 1))
  sleep 1
done
if [ "$smoke_seeded" -ne 1 ]; then
  printf 'FAIL: the PostgreSQL sidecar never accepted the fixture over TCP\n' >&2
  printf '%s\n' "$smoke_seed_out" >&2
  smoke_cleanup
  exit 1
fi

# Second fixture, in the maintenance database so the positive cycle above never
# sees it: a table with row-level security enabled and no policy. pg_dump runs
# with row_security=off, and a role that is neither the owner nor BYPASSRLS
# cannot read such a table under that setting, so pg_dump itself exits 1 after
# a successful connection. That is the shape of a real dump failure (a locked
# table, a revoked grant, a server that dies mid-COPY): the client is intact and
# the wrapped process reports the failure through its exit status alone.
if ! smoke_seed_out=$(docker exec "$SMOKE_PG" psql -v ON_ERROR_STOP=1 \
  --host=127.0.0.1 --username=postgres --dbname=postgres \
  --command="CREATE TABLE smoke_rls (id int PRIMARY KEY);
    ALTER TABLE smoke_rls ENABLE ROW LEVEL SECURITY;" 2>&1); then
  printf 'FAIL: could not seed the row-level-security fixture in the maintenance database\n' >&2
  printf '%s\n' "$smoke_seed_out" >&2
  smoke_cleanup
  exit 1
fi

# Word-split by the harness; none of these values contains a space.
# DUMP_FREE_KB_WARN=0: the tmpfs is far below the 1 GiB default, which would log
# a WARN on every run and teach the reader to ignore it.
SMOKE_RUN_ARGS="--network ${SMOKE_NET} -e DB_SPECS=${SMOKE_PG}:5432:${SMOKE_DB}:${SMOKE_ROLE} -e PGPASSWORD=${SMOKE_PW} -e DUMP_INTERVAL=off -e DUMP_KEEP=1 -e DUMP_TIMEOUT=60 -e DUMP_FREE_KB_WARN=0 --tmpfs /dumps:size=32m,mode=1777"

smoke_verify() {
  # spec.ServerDir's layout: DUMP_DIR/<host>_<port>/<dbname>.dump at DUMP_KEEP=1.
  smoke_dump="/dumps/${SMOKE_PG}_5432/${SMOKE_DB}.dump"

  # One real cycle through the app's own client. `run` exits 0 iff every database
  # succeeded. Its log lines go to the EXEC's stdout, NOT the container's stream,
  # so they are captured here; polling `docker logs` would never see them, and
  # there is correspondingly no log-flush race to poll around.
  if ! smoke_out=$(docker exec "$SMOKE_CONTAINER" pg-autodump run 2>&1); then
    printf 'FAIL: the dump cycle against the live sidecar did not exit 0\n' >&2
    printf '%s\n' "$smoke_out" >&2
    return 1
  fi

  # `run` also exits 0 when it merely QUEUES its demand behind an in-flight
  # cycle, so the exit code alone does not prove a dump happened. The file does.
  if ! docker exec "$SMOKE_CONTAINER" test -s "$smoke_dump"; then
    printf 'FAIL: the cycle exited 0 but wrote no dump at %s\n' "$smoke_dump" >&2
    docker exec "$SMOKE_CONTAINER" ls -lR /dumps >&2 || true
    return 1
  fi

  # Decompress the archive with the shipped pg_restore and read what is inside:
  # the table's data block AND the seeded row. Strictly stronger than the app's
  # own verify-before-replace, which proves only that pg_restore can READ the
  # table of contents. No network, no privilege beyond the dump file.
  if ! smoke_sql=$(docker exec "$SMOKE_CONTAINER" pg_restore --file=- "$smoke_dump" 2>&1); then
    printf 'FAIL: the shipped pg_restore could not read back the archive it just verified\n' >&2
    printf '%s\n' "$smoke_sql" >&2
    return 1
  fi
  if ! printf '%s\n' "$smoke_sql" | grep -qF 'COPY public.smoke_rows'; then
    printf 'FAIL: the archive carries no data block for the seeded table\n' >&2
    printf '%s\n' "$smoke_sql" | head -40 >&2
    return 1
  fi
  if ! printf '%s\n' "$smoke_sql" | grep -qF 'pg-autodump smoke row'; then
    printf 'FAIL: the archive has the table but not its row; the dump carries no data\n' >&2
    printf '%s\n' "$smoke_sql" | head -40 >&2
    return 1
  fi

  # First negative control: pg_dump exits non-zero on a reachable server. The
  # probe (a psql round-trip) passes, then pg_dump refuses the RLS table, so the
  # only thing standing between this and a "successful" cycle is the wrapper
  # reading the child's exit status. The exec's own DB_SPECS points the cycle at
  # the maintenance database; the container's other variables are inherited.
  if smoke_out=$(docker exec -e "DB_SPECS=${SMOKE_PG}:5432:postgres:${SMOKE_ROLE}" \
    "$SMOKE_CONTAINER" pg-autodump run 2>&1); then
    printf 'FAIL: a pg_dump that exited non-zero was reported as a successful dump cycle\n' >&2
    printf '%s\n' "$smoke_out" >&2
    return 1
  fi
  if ! printf '%s\n' "$smoke_out" | grep -qF 'dump pg_error'; then
    printf 'FAIL: the cycle exited non-zero but not for the pg_dump failure; no per-database pg_error line\n' >&2
    printf '%s\n' "$smoke_out" >&2
    return 1
  fi
  if ! printf '%s\n' "$smoke_out" | grep -qF 'failed=1'; then
    printf 'FAIL: the heartbeat line did not count the failed database\n' >&2
    printf '%s\n' "$smoke_out" >&2
    return 1
  fi
  # A failed cycle removes the health marker, whichever process ran it: the
  # exec'd `run` above shares the resident server's /tmp.
  if docker exec "$SMOKE_CONTAINER" pg-autodump health; then
    printf 'FAIL: the container stayed healthy after a cycle with a failed database\n' >&2
    return 1
  fi
  # Recovery needs no restart, and it runs through the RESIDENT server rather
  # than a second exec'd `run`: `trigger` POSTs to the server's own /dump, so
  # this is the only assertion that proves the server's cycles move health at
  # all (an exec'd `run` writes the marker itself). It uses the container's own
  # DB_SPECS and inherits AUTH_TOKEN, and exits 0 only on a 200.
  if ! smoke_out=$(docker exec "$SMOKE_CONTAINER" pg-autodump trigger 2>&1); then
    printf 'FAIL: the recovery cycle through the resident server did not exit 0\n' >&2
    printf '%s\n' "$smoke_out" >&2
    return 1
  fi
  if ! docker exec "$SMOKE_CONTAINER" pg-autodump health; then
    printf 'FAIL: the container stayed unhealthy after a fully successful cycle\n' >&2
    return 1
  fi

  # Second negative control, last because it breaks the image. Hiding the libpq
  # every pg client links against is the shape of an apk revision bump that
  # leaves the binaries in place and unrunnable. The cycle's preflight catches it
  # before any dump starts.
  if ! docker exec -u 0 "$SMOKE_CONTAINER" \
    sh -c 'set -e; ls /usr/lib/libpq.so.5.* >/dev/null; mv /usr/lib/libpq.so.5.* /tmp/'; then
    printf 'FAIL: no /usr/lib/libpq.so.5.* to hide; the control premise moved and the path needs re-pointing\n' >&2
    return 1
  fi
  if smoke_out=$(docker exec "$SMOKE_CONTAINER" pg-autodump run 2>&1); then
    printf 'FAIL: a pg client that cannot execute was reported as a successful dump cycle\n' >&2
    printf '%s\n' "$smoke_out" >&2
    return 1
  fi
  if ! printf '%s\n' "$smoke_out" | grep -qF 'run preconditions not met'; then
    printf 'FAIL: the cycle exited non-zero but not because the client binaries failed the preflight\n' >&2
    printf '%s\n' "$smoke_out" >&2
    return 1
  fi
  # A cycle that cannot start is a failed cycle: the preflight failure removes
  # the marker just as a failed database would.
  if docker exec "$SMOKE_CONTAINER" pg-autodump health; then
    printf 'FAIL: the container stayed healthy after a cycle that failed its preflight\n' >&2
    return 1
  fi

  # Every assertion above is silent on success, so name what was proved: a run
  # that dumped the live sidecar and one whose hook returned early otherwise
  # print the same thing, leaving the harness's elapsed time unaccountable.
  printf 'pg-autodump payload: one real cycle dumped the live sidecar to %s and the shipped pg_restore read the seeded table and its row back out; a pg_dump refused by row-level security was reported as a failed cycle with its pg_error line and failed=1 heartbeat and made the container unhealthy, and a clean cycle through the resident server restored health without a restart; a client whose libpq was hidden was then reported failed at preflight and made the container unhealthy again\n' "$smoke_dump"
}
