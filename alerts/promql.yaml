# Alert rules for pg-autodump as a Prometheus rule group, for Prometheus, Mimir,
# vmalert or any ruler that reads them. Load this file or alerts/logql.yaml, not
# both. The rules read GET /metrics on LISTEN_ADDR, scraped as job
# `pg-autodump`. Thresholds and severity labels are starting points.
# PgAutodumpDumpStale reads pg_autodump_cycle_deadline_timestamp_seconds, which
# sizes itself from your settings; its 50h window applies only while that reads
# 0 (DUMP_INTERVAL=off): set it to two of your runs plus a run's time. Load the
# file of the release you run. PgAutodumpDumpStale and PgAutodumpDown exist
# only here; PgAutodumpCycleMissing covers them in alerts/logql.yaml. One-shot
# `run` setups and the long form: docs/monitoring.md.
groups:
  - name: pg-autodump
    rules:
      # Two arms, because neither covers the other: `up == 0` catches a target
      # that fails its scrape and keeps its labels, `absent(up{...})` catches a
      # target that is gone. Use an exact job matcher, never a regex.
      - alert: PgAutodumpDown
        expr: up{job="pg-autodump"} == 0 or absent(up{job="pg-autodump"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "pg-autodump is not being scraped"
          description: >
            No successful scrape for 5m: the container is stopped,
            crash-looping or refusing to start, or the scrape cannot reach
            LISTEN_ADDR. Check the container's state and its log.
      # A state rule: it holds while the database's latest dump failed and
      # resolves at its next good dump. After a restart the series reads the
      # last-run record, so a failure on record keeps firing.
      - alert: PgAutodumpDumpFailed
        expr: pg_autodump_dump_ok == 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "pg-autodump: the latest dump of {{ $labels.db }} failed"
          description: >
            The latest dump of {{ $labels.db }} on {{ $labels.server }}
            failed, so its backup is getting older. The last good dump is
            kept. The `dump <reason>` log line for the database names the
            cause.
      # Two arms. While the built-in timer runs, the cycle deadline decides:
      # a fully successful cycle moves it two DUMP_INTERVAL runs plus one
      # cycle's longest run ahead, so a stopped timer and cycles that keep
      # failing both cross it, and it sizes itself from your settings. With
      # DUMP_INTERVAL=off the deadline reads 0 and the 50h window on each
      # database's newest dump decides; a database with no dump yet has no
      # series, so a new install stays quiet until its first dump.
      - alert: PgAutodumpDumpStale
        expr: |
          (time() > pg_autodump_cycle_deadline_timestamp_seconds + 900 and pg_autodump_cycle_deadline_timestamp_seconds > 0)
          or
          (time() - pg_autodump_newest_dump_timestamp_seconds > 50 * 3600 and on (job, instance) pg_autodump_cycle_deadline_timestamp_seconds == 0)
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "pg-autodump: dumps are overdue{{ with $labels.db }} for {{ . }}{{ end }}"
          description: >
            {{ if $labels.db }}The newest verified dump of {{ $labels.db }} on
            {{ $labels.server }} is older than 50h, with the built-in timer
            off. Dumps may be failing, or your trigger may have stopped. Check
            the container, your scheduler and PgAutodumpDumpFailed.{{ else }}The
            built-in timer's deadline passed over 15m ago with no fully
            successful dump cycle. Dumps may be failing, or the timer may have
            stopped. Check the container, its log and
            PgAutodumpDumpFailed.{{ end }}
